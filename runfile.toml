[install-auth-client]
alias = "iac"
description = "Installs the auth ts client dependencies"
cmd = "cd ./auth/client/ts && npm install"

[gen-auth-client]
alias = "gac"
description = "Generates auth typescript types and build the auth ts client"
after = "install-auth-client"
cmd = """
node ./auth/client/ts/generate_types.mjs && \
cd ./auth/client/ts && npm run build"""

[install-supporter-ts]
alias = "ist"
description = "Installs the supporter ts package dependencies"
cmd = "cd ./supporter/ts && npm install"

[test-supporter-ts]
alias = "tst"
description = "Builds and tests the supporter ts package"
after = "install-supporter-ts"
cmd = "cd ./supporter/ts && npm test"

[example-server]
alias = "es"
description = "Runs the example app server (see example/README.md)"
cmd = "cargo run -p example_server"

[example-mock-idp]
alias = "emi"
description = "Runs the mock OIDC provider the example app can use to log in"
cmd = "cargo run -p example_mock_idp"

[test-example]
alias = "te"
description = "Runs the api test suite against the example app"
cmd = "cargo test -p example_server"

[gen-example-client]
alias = "gec"
description = "Generates the example typescript types and builds the example ts client"
cmd = """
node ./example/client/ts/generate_types.mjs && \
cd ./example/client/ts && npm install && npm run build"""

[test-example-ui]
alias = "teu"
description = "Builds the example ui and runs the browser tests against the example app"
after = "gen-example-client"
cmd = "cd ./example/ui && npm install && npm run build && npx playwright test"
