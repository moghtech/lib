[workspace]
resolver = "2"
members = [
  "auth/client/rs",
  "auth/server",
  "crates/*",
  "crates/resolver/derive",
  "example/client/rs",
  "example/mock_idp",
  "example/server",
  "supporter/rs",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/moghtech/lib"

[workspace.dependencies]
# MOGH API
mogh_auth_client = "8.0.0"
mogh_auth_server = "8.0.0"

# MOGH
mogh_cache = "2.0.0"
mogh_config = "4.0.0"
mogh_encryption = "3.0.0"
mogh_error = "2.0.0"
mogh_logger = { version = "2.0.0", default-features = false }
mogh_pki = "4.0.0"
mogh_rate_limit = "3.0.0"
mogh_request_ip = "3.0.0"
mogh_resolver = "2.0.0"
mogh_resolver_derive = "2.0.0"
mogh_secret_file = "2.0.0"
mogh_server = "3.0.0"
mogh_supporter = "2.0.0"
mogh_validations = "2.0.0"

# CICADA
cicada_loader = "0.23.0"

# ASYNC
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form", "rustls"] }
tokio = { version = "1.53.2", features = ["full"] }
arc-swap = "1.9.2"

# SERVER
tower-http = { version = "0.7.1", features = ["fs", "cors", "set-header"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
axum = { version = "0.8.9", features = ["macros"] }
http-body-util = "0.1.5"
http-body = "1.1.0"
tower-sessions = "0.15.0"
async-trait = "0.1.92"
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5.3", features = ["util"] }
urlencoding = "2.1.3"
h2 = "0.4.20"

# SER/DE
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_qs = "1.0.0"
toml = "1.1.8"
url = "2.5.8"

# CRYPTO
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
data-encoding = "2.11.1"
rand = "0.10.3"
zeroize = { version = "1.9.0", features = ["derive"] }
sha2 = "0.11.0"
subtle = "2.6.1"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }

# AUTH
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5.5"
openidconnect = { version = "4.0.1", features = ["accept-rfc3339-timestamps"] }
# Only to mint test tokens, openidconnect uses it for token timestamps.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
totp-rs = { version = "6.0.0", features = ["qr", "serde"] }
bcrypt = "0.19.3"

# PKI
pem-rfc7468 = { version = "1.0.0", features = ["alloc"] }
snow = "0.10.0"
# Held back: 2.x shares curve25519-dalek 4 with 'snow' and 'openidconnect'.
ed25519-dalek = "2.2.0"
# Held back: same version as ed25519-dalek's.
curve25519-dalek = "4.1.3"
# Held back for 'openidconnect'
pkcs8 = "0.10.2"
# Held back for 'openidconnect'
spki = "0.7.3"
# Held back for 'openidconnect'
der = "0.7.10"

# ERROR
anyhow = "1.0.104"
thiserror = "2.0.21"

# LOGGING
# tracing-opentelemetry 0.34 is tied to opentelemetry 0.33
tracing-opentelemetry = "0.34.0"
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "internal-logs"] }
opentelemetry_sdk = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
opentelemetry-semantic-conventions = "0.33.0"
opentelemetry = "0.33.0"
tracing = "0.1.44"

# MACRO
quote = "1.0.47"
proc-macro2 = "1.0.107"
syn = "3.0.6"

# MISC
clap = { version = "4.6.7", features = ["derive"] }
uuid = { version = "1.27.0", features = ["v4"] }
typeshare = "1.0.5"
libc = "0.2.190"
wildcard = "0.3.0"
ipnet = "2.12.2"
colored = "3.1.1"
utoipa = "6.0.0"
regex = "1.13.1"
flate2 = "1.1.10"


[patch.crates-io]

# MOGH API
mogh_auth_client = { path = "auth/client/rs" }
mogh_auth_server = { path = "auth/server" }

# MOGH
mogh_cache = { path = "crates/cache" }
mogh_config = { path = "crates/config" }
mogh_encryption = { path = "crates/encryption" }
mogh_error = { path = "crates/error" }
mogh_logger = { path = "crates/logger" }
mogh_pki = { path = "crates/pki" }
mogh_rate_limit = { path = "crates/rate_limit" }
mogh_request_ip = { path = "crates/request_ip" }
mogh_resolver = { path = "crates/resolver" }
mogh_resolver_derive = { path = "crates/resolver/derive" }
mogh_secret_file = { path = "crates/secret_file" }
mogh_server = { path = "crates/server" }
mogh_supporter = { path = "supporter/rs" }
mogh_validations = { path = "crates/validations" }