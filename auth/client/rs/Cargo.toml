[package]
name = "mogh_auth_client"
description = "Client library for Mogh Auth Server embedded API."
version = "8.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Adds `request::blocking`, the request functions
# for a `reqwest::blocking::Client`.
blocking = ["reqwest/blocking"]
# Signing requests with the private key of a signing key, see
# `signature`.
pki = ["dep:mogh_pki", "dep:rand"]
utoipa = ["dep:utoipa", "mogh_error/utoipa"]

[dependencies]
# MOGH
mogh_error = { workspace = true, features = ["axum"] }
mogh_resolver.workspace = true
mogh_pki = { workspace = true, optional = true }
# EXTERNAL
utoipa = { workspace = true, optional = true }
# The passkey challenges and credentials sent over the wire. The
# stored passkey (webauthn-rs) is the server's.
webauthn-rs-proto.workspace = true
serde_json.workspace = true
typeshare.workspace = true
zeroize.workspace = true
sha2.workspace = true
# The nonce of a signed request.
rand = { workspace = true, optional = true }
reqwest.workspace = true
anyhow.workspace = true
serde.workspace = true
strum.workspace = true

[dev-dependencies]
# The tests of the async request functions.
tokio.workspace = true
