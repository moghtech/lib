[package]
name = "mogh_pki"
description = "Public key identification utilities using Ed25519 signatures and Noise handshakes"
version = "4.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
cli = ["dep:clap", "dep:strum", "dep:serde", "dep:serde_json", "dep:colored"]

[dependencies]
# MOGH
mogh_secret_file = { workspace = true, features = ["write", "tokio"] }
# EXTERNAL
serde_json = { workspace = true, optional = true }
colored = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
strum = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
data-encoding.workspace = true
ed25519-dalek.workspace = true
pem-rfc7468.workspace = true
arc-swap.workspace = true
tracing.workspace = true
anyhow.workspace = true
subtle.workspace = true
zeroize.workspace = true
pkcs8.workspace = true
rand.workspace = true
snow.workspace = true
spki.workspace = true
der.workspace = true

[dev-dependencies]
curve25519-dalek.workspace = true
tokio.workspace = true
