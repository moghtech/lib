[package]
name = "mogh_secret_file"
description = "Utilities for reading and writing secret files"
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["read"]
read = ["dep:thiserror"]
write = ["dep:libc"]
# The async writers ('write_async', 'write_new_async').
tokio = ["dep:tokio", "write"]

[dependencies]
tokio = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

# 'write' keeps a replaced file's ACL / security label (xattrs).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = { workspace = true, optional = true }