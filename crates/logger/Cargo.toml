[package]
name = "mogh_logger"
description = "Configurable application level logger using tracing."
version = "2.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["init"]
init = [
  "dep:opentelemetry-semantic-conventions",
  "dep:tracing-opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:tracing-subscriber",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry",
  "dep:data-encoding",
  "dep:anyhow",
]
# On `init`, logs the custom root CAs the TLS clients trust from
# `SSL_CERT_DIR`, for a binary shipped in a container image.
custom_ca = ["init", "dep:rustls-native-certs", "dep:rustls"]

[dependencies]
tracing.workspace = true
serde.workspace = true
url.workspace = true
opentelemetry-semantic-conventions = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
# Used to read the certificate directory the same as the consumers (reqwest etc.)
rustls-native-certs = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "otel_export"
required-features = ["init"]

[[test]]
name = "otel_export_credentials"
required-features = ["init"]
