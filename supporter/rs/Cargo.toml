[package]
name = "mogh_supporter"
description = "Mogh Supporter schema and embedded API"
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `server`: the embedded api (`server::router`), which an app mounts
# at `/supporter` with its `AuthImpl` of mogh_auth_server.
server = [
  "dep:mogh_auth_server",
  "dep:mogh_request_ip",
  "dep:serde_json",
  "dep:arc-swap",
  "dep:anyhow",
  "dep:tokio",
  "dep:strum",
  "dep:axum",
]

[dependencies]
# MOGH
mogh_error = { workspace = true, features = ["axum"] }
mogh_resolver.workspace = true
mogh_auth_server = { workspace = true, optional = true }
mogh_request_ip = { workspace = true, optional = true }
# EXTERNAL
serde_json = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
strum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
ed25519-dalek.workspace = true
data-encoding.workspace = true
typeshare.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
serde.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true
